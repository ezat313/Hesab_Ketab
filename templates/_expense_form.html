{% macro expense_fields(values, years) %}
<div class="form-row">
  <div class="field">
    <label for="amount">مبلغ (افغانی)</label>
    <input id="amount" name="amount" inputmode="numeric" autocomplete="off" placeholder="مثلاً ۵۰۰" required value="{{ values.amount }}">
  </div>
  <div class="field">
    <label for="category">کتگوری</label>
    <select id="category" name="category">
      {% for c in CATEGORIES %}
      <option value="{{ c.key }}" {{ 'selected' if c.key == values.category }}>{{ c.label }}</option>
      {% endfor %}
    </select>
  </div>
</div>
<fieldset class="field">
  <legend>تاریخ</legend>
  <div class="date-row">
    <select name="day" aria-label="روز">
      {% for d in range(1, 32) %}
      <option value="{{ d }}" {{ 'selected' if d == values.day }}>{{ d|fa_digits }}</option>
      {% endfor %}
    </select>
    <select name="month" aria-label="ماه">
      {% for name in MONTH_NAMES %}
      <option value="{{ loop.index }}" {{ 'selected' if loop.index == values.month }}>{{ name }}</option>
      {% endfor %}
    </select>
    <select name="year" aria-label="سال">
      {% for y in years %}
      <option value="{{ y }}" {{ 'selected' if y == values.year }}>{{ y|fa_digits }}</option>
      {% endfor %}
    </select>
  </div>
</fieldset>
<div class="field">
  <label for="note">یادداشت <span class="muted">(اختیاری)</span></label>
  <input id="note" name="note" maxlength="200" placeholder="مثلاً آرد و برنج" value="{{ values.note }}">
</div>
{% endmacro %}
