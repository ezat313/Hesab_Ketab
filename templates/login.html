{% extends "base.html" %}
{% block title %}ورود · حساب و کتاب خانه{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1>ورود</h1>
    <p class="muted">با ایمیل و رمز عبور خود وارد شوید.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">ایمیل</label>
        <input id="email" name="email" type="email" dir="ltr" autocomplete="email" required value="{{ form.get('email', '') }}">
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ورود</button>
    </form>
    <p class="auth-switch">حساب ندارید؟ <a href="{{ url_for('register') }}">ثبت‌نام کنید</a></p>
  </div>
</div>
{% endblock %}
